services:
  - type: web
    name: remote-search-work-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --frozen-lockfile=false && pnpm --filter ./backend build
    startCommand: node backend/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: SCRAPER_INTERVAL_MINUTES
        value: 10
      - key: CACHE_TTL_SECONDS
        value: 600
      - key: CORS_ORIGIN
        value: "*"
