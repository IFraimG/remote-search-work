name: CI Pipeline

on:
  push:
    branches: [main, "feat/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint, Typecheck and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      # Backend Checks
      - name: Backend - Lint (ESLint)
        run: pnpm --filter ./backend lint

      - name: Backend - Typecheck (tsc)
        run: pnpm --filter ./backend typecheck

      - name: Backend - Build
        run: pnpm --filter ./backend build

      # Frontend Checks
      - name: Frontend - Lint JS/TS/Vue (ESLint)
        run: pnpm --filter ./frontend lint:js

      - name: Frontend - Lint Styles (Stylelint)
        run: pnpm --filter ./frontend lint:style

      - name: Frontend - Typecheck (vue-tsc)
        run: pnpm --filter ./frontend typecheck

      - name: Frontend - Build (Vite)
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://remote-search-work-backend.onrender.com' }}
        run: pnpm --filter ./frontend build
